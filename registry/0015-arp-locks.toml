# ---------------------------------------------------------------- 0015-arp-locks
# P-locks for the ARP page (ids 11..18 -> lock slots 101..108, which no sound
# parameter uses and the pattern already saves). Code placed by mods/0015-arp-locks/
# pack.py in the gaps 0007 leaves (0015 excludes it). State: free DDR 0x4680e200.
#
# The UI (v0.5): stock edits held-trig locks in a temporary sound whose value array
# only covers the sound parameters, so an ARP lock is written and read in the
# pattern's lock words directly: the encoder's held-trig call (0x40025a06),
# page_get_value (0x400239e2), the knob drawer's knob_value (0x40024b42: value and the inverted "locked" style) and the lock-clear routine (0x40023a80) hand ARP ids
# with a trig held to arpl_held / arpl_pgv / arpl_clear. The engine: the lock apply
# routine (0x40077ad2) takes the ARP slots out and notes them per track; the
# arpeggiator's five `adda.l #0x4096ff52` (its track-data base) go through
# arpl_base, which hands back a copy with the locked values in while a lock is active.
#
# v0.5: knobs I and J of the ARP page (descriptor ids 9 and 10, stock 0) become
# switches on the blank placeholder ids 276 / 277: SLD (0002's per-track 303 slide,
# kit FX byte 26 + 6t + 5) and MPE on/off (0013, kit FX byte 52), saved by 0006. v0.6: both drawn
# with LEGATO's on/off switch graphic (the knob draw's graphic call, 0x400231ec, gets
# id 15 for them); MPE now defaults to off (0013 built with kit_switch = 1).
# Their value, dial, name and text, and their encoder, go through 0015's gates.


